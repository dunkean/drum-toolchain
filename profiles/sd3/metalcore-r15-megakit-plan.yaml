# Capture sheet for the deterministically assembled user SD3 preset.  The
# generated .sd3p stays under captures/ and is intentionally gitignored.
schema_version: 1
kind: sd3-megakit-plan
id: greg_hybrid_r15_megakit
sd3p_output: "captures/sd3/Greg_Hybrid_r15_MegaKit_v2.sd3p"
build_recipe: "profiles/sd3/metalcore-r15-megakit-build.yaml"
status: generated-local-validation-required
base_preset:
  source: "captures/sd3/Kit_metalcore_4_capture.sd3p"
  library: Modern Metal EZX
  mixer_preset: Djentle Beast
  instruction: "Retain the proven Metalcore instruments, mixer, CC4 hi-hat and cymbal choke aliases as the baseline."
sources:
  modern_metal: {product: "Modern Metal EZX", role: "Metalcore acoustic baseline"}
  death_darkness: {product: "Death & Darkness SDX", role: "Djentle Beast Deftones snare plus Sleep kick and tom family"}
  electronic_edge: {product: "Electronic Edge EZX", role: "DnB, industrial and electronic drums"}
  hip_hop: {product: "Hip Hop EZX", role: "808, clap and compact electronic percussion"}
  metal_foundry: {product: "Metal Foundry SDX", role: "optional heavier acoustic alternate"}
  progressive_foundry: {product: "Progressive Foundry SDX", role: "Sleep Token snare"}
mixer:
  buses:
    - {id: kit_close, sd3_bus: "0..3", purpose: "Modern Metal close microphones and acoustic groups"}
    - {id: kit_room, sd3_bus: "4..9", purpose: "Modern Metal ambience and parallel groups"}
    - {id: dnb_kicks, sd3_bus: 10, purpose: "DnB kicks, DNBKit inserts and gain staging"}
    - {id: dnb_snares, sd3_bus: 11, purpose: "DnB snares, DNBKit snare inserts and gain staging"}
    - {id: electronic_toms, sd3_bus: 12, purpose: "Electronic Edge high/mid/low tom family"}
    - {id: electronic_hats, sd3_bus: 13, purpose: "Electronic Edge closed/open hats"}
    - {id: industrial_drums, sd3_bus: 14, purpose: "Industrial kick/snare family with separate effects"}
    - {id: electro_drums, sd3_bus: 15, purpose: "Electro/trap kick/snare family with separate effects"}
    - {id: print, purpose: "stereo capture output, fixed gain and sample rate"}
  rules:
    - "Route every capture through print with fixed gain; disable master limiting and global reverb while capturing."
    - "Keep CC4 on channel 10 for hi-hat bow/edge; do not replace it with discrete raw source notes."
    - "One MegaKit contains all rows below; scenes/palettes select notes externally and never load another SD3 kit."

  - {logical: crash2.bow, note: 74, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: crash2.edge, note: 75, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: crash3.edge, note: 76, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: splash1.acoustic, note: 77, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: splash2.acoustic, note: 78, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: china1.edge, note: 79, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: china1.bell, note: 80, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: china2.edge, note: 81, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: china2.bell, note: 82, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: ride.bow, note: 83, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: ride.bell, note: 84, source: modern_metal, capture: true, velocities: dense4, rr: 3}
  - {logical: stack.acoustic, note: 85, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: perc.metallic, note: 88, source: electronic_edge, capture: true, velocities: dense4, rr: 1}
  - {logical: stack.glitch, note: 89, source: electronic_edge, capture: true, velocities: dense4, rr: 1}
  - {logical: perc.utility, note: 92, source: hip_hop, selection: "cowbell", capture: true, velocities: dense4, rr: 1}
  - {logical: perc.cowbell, note: 92, source: hip_hop, selection: "same SD3 note/sample as perc.utility", capture: false, shared_with: perc.utility}
  - {logical: perc.woodblock, note: 93, source: hip_hop, capture: true, velocities: dense4, rr: 1}
  - {logical: stack.metallic, note: 88, source: electronic_edge, selection: "same SD3 note/sample as perc.metallic", capture: false, shared_with: perc.metallic}
  - {logical: stack.clap, note: 99, source: hip_hop, capture: true, velocities: dense4, rr: 2}
velocity_sets:
  dense7: [24, 40, 56, 72, 88, 104, 120]
  dense5: [24, 48, 72, 96, 120]
  dense4: [40, 64, 88, 112]
scenes:
  metalcore: {base: modern_metal, palettes: [vp1_snare1, vp2_flex, vp3_percussion_family, vp4_percussion_variant]}
  sleep_token: {base: progressive_foundry, overrides: [kick.sleep, snare1.sleep, snare2.sleep, tom1.sleep, tom2.sleep, tom3.sleep]}
  deftones: {base: modern_metal, overrides: [snare1.deftones, snare2.deftones]}
  dnb: {base: electronic_edge, overrides: [kick.dnb, snare1.electro, snare2.electro, hh.electronic_closed, hh.electronic_open, stack.glitch, perc.click]}
  industrial: {base: electronic_edge, overrides: [kick.industrial, snare1.industrial, snare2.electro, stack.metallic, perc.metallic]}
  electro: {base: hip_hop, overrides: [kick.trap, snare1.electro, snare2.electro, hh.electronic_closed, hh.electronic_open, stack.clap, perc.clap]}

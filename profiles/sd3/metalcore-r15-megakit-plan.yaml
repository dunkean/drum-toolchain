# Declarative build sheet for the user-created SD3 preset.  SD3P is a
# proprietary binary and is intentionally not synthesized by this repository.
# Apply this sheet with SD3 MIDI Learn, save the resulting preset manually as
# "Greg Hybrid r15 MegaKit.sd3p", then record its revision in the capture run.
schema_version: 1
kind: sd3-megakit-plan
id: greg_hybrid_r15_megakit
sd3p_output: "Greg Hybrid r15 MegaKit.sd3p"
status: manual-sd3-application-required
base_preset:
  source: Modern Metal EZX
  instruction: "Duplicate the existing Metalcore kit; retain its acoustic kit, close mics and routing as the baseline."
sources:
  modern_metal: {product: "Modern Metal EZX", role: "Metalcore acoustic baseline"}
  death_darkness: {product: "Death & Darkness SDX", role: "Djentle Beast Deftones snare and optional cymbal colour"}
  electronic_edge: {product: "Electronic Edge EZX", role: "DnB, industrial and electronic drums"}
  hip_hop: {product: "Hip Hop EZX", role: "808, clap and compact electronic percussion"}
  metal_foundry: {product: "Metal Foundry SDX", role: "optional heavier acoustic alternate"}
  progressive_foundry: {product: "Progressive Foundry SDX", role: "Sleep-oriented alternate body and ambience"}
mixer:
  buses:
    - {id: kit_close, purpose: "capture source; close microphones, no master limiter"}
    - {id: kit_room, purpose: "optional ambience; excluded from raw DDrum4 capture"}
    - {id: electronic, purpose: "Electronic Edge/Hip Hop instruments"}
    - {id: print, purpose: "stereo capture output, fixed gain and sample rate"}
  rules:
    - "Route every capture through print with fixed gain; disable master limiting and global reverb while capturing."
    - "Keep CC4 on channel 10 for hi-hat bow/edge; do not replace it with discrete raw source notes."
    - "One MegaKit contains all rows below; scenes/palettes select notes externally and never load another SD3 kit."
articulations:
  - {logical: kick.acoustic, note: 24, source: modern_metal, capture: true, velocities: dense7, rr: 4}
  - {logical: kick.sleep, note: 25, source: progressive_foundry, capture: true, velocities: dense7, rr: 3}
  - {logical: kick.dnb, note: 26, source: electronic_edge, capture: true, velocities: dense5, rr: 2}
  - {logical: kick.industrial, note: 27, source: electronic_edge, capture: true, velocities: dense5, rr: 2}
  - {logical: kick.trap, note: 28, source: hip_hop, capture: true, velocities: dense5, rr: 2}
  - {logical: snare1.metalcore, note: 32, source: modern_metal, capture: true, velocities: dense7, rr: 4}
  - {logical: snare2.metalcore, note: 33, source: modern_metal, capture: true, velocities: dense7, rr: 3}
  - {logical: rim1.rimshot, note: 35, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: rim1.cross, note: 36, source: modern_metal, capture: true, velocities: dense4, rr: 2}
  - {logical: snare1.deftones, note: 37, source: death_darkness, selection: "Djentle Beast snare", capture: true, velocities: dense7, rr: 3}
  - {logical: snare2.deftones, note: 38, source: death_darkness, selection: "Djentle Beast snare alternate articulation", capture: true, velocities: dense7, rr: 3}
  - {logical: rim2.rimshot, note: 40, source: death_darkness, capture: true, velocities: dense5, rr: 3}
  - {logical: rim2.cross, note: 41, source: death_darkness, capture: true, velocities: dense4, rr: 2}
  - {logical: snare1.sleep, note: 42, source: progressive_foundry, capture: true, velocities: dense7, rr: 3}
  - {logical: snare2.sleep, note: 43, source: progressive_foundry, capture: true, velocities: dense7, rr: 3}
  - {logical: snare1.electro, note: 47, source: electronic_edge, capture: true, velocities: dense5, rr: 2}
  - {logical: snare1.industrial, note: 48, source: electronic_edge, capture: true, velocities: dense5, rr: 2}
  - {logical: snare2.electro, note: 49, source: electronic_edge, capture: true, velocities: dense5, rr: 2}
  - {logical: perc.clap, note: 50, source: hip_hop, capture: true, velocities: dense4, rr: 2}
  - {logical: perc.click, note: 51, source: electronic_edge, capture: true, velocities: dense4, rr: 1}
  - {logical: tom1.acoustic, note: 56, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: tom2.acoustic, note: 57, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: tom3.acoustic, note: 58, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: tom4.acoustic, note: 59, source: modern_metal, capture: true, velocities: dense5, rr: 3}
  - {logical: tom1.sleep, note: 60, source: progressive_foundry, capture: true, velocities: dense5, rr: 2}
  - {logical: tom2.sleep, note: 61, source: progressive_foundry, capture: true, velocities: dense5, rr: 2}
  - {logical: tom3.sleep, note: 62, source: progressive_foundry, capture: true, velocities: dense5, rr: 2}

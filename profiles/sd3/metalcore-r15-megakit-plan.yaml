  sleep_token: {base: progressive_foundry, overrides: [kick.sleep, snare1.sleep, snare2.sleep, tom1.sleep, tom2.sleep, tom3.sleep, tom4.sleep]}
  deftones: {base: modern_metal, overrides: [snare1.deftones, snare2.deftones]}
  dnb: {base: electronic_edge, overrides: [kick.dnb, snare1.dnb, snare2.electro, tom1.electronic, tom2.electronic, tom3.electronic, hh.electronic_closed, hh.electronic_open, stack.glitch, perc.click]}
  industrial: {base: electronic_edge, overrides: [kick.industrial, snare1.industrial, snare2.electro, tom1.electronic, tom2.electronic, tom3.electronic, stack.metallic, perc.metallic]}
  electro: {base: hip_hop, overrides: [kick.trap, snare1.electro, snare2.electro, tom1.electronic, tom2.electronic, tom3.electronic, hh.electronic_closed, hh.electronic_open, stack.clap, perc.clap]}

mixer:
  buses:
    - {id: kit_close, sd3_bus: "0..3", purpose: "Modern Metal close microphones and acoustic groups"}
    - {id: kit_room, sd3_bus: "4..9", purpose: "Modern Metal ambience and parallel groups"}
    - {id: dnb_kicks, sd3_bus: 10, purpose: "DnB kicks, DNBKit inserts and gain staging"}
    - {id: dnb_snares, sd3_bus: 11, purpose: "DnB snares, DNBKit snare inserts and gain staging"}
    - {id: electronic_toms, sd3_bus: 12, purpose: "Electronic Edge high/mid/low tom family"}
    - {id: electronic_hats, sd3_bus: 13, purpose: "Electronic Edge closed/open hats"}
    - {id: industrial_drums, sd3_bus: 14, purpose: "Industrial kick/snare family with separate effects"}
    - {id: electro_drums, sd3_bus: 15, purpose: "Electro/trap kick/snare family with separate effects"}
    - {id: sleep_toms, sd3_bus: 16, purpose: "Sleep Token tom family with the source tom-bus effects"}
    - {id: deftones_snare, sd3_bus: 17, purpose: "Deftones snare family with the source snare-bus effects"}
    - {id: sleep_snare, sd3_bus: 18, purpose: "Sleep Token snare family with its dedicated source processing"}
    - {id: print, purpose: "stereo capture output, fixed gain and sample rate"}
  rules:
    - "Route every capture through print with fixed gain; disable master limiting and global reverb while capturing."
    - "Keep CC4 on channel 10 for hi-hat bow/edge; do not replace it with discrete raw source notes."
    - "One MegaKit contains all rows below; scenes/palettes select notes externally and never load another SD3 kit."
drumgizmo_composites:
  - target: snare1.deftones
    sources: [snare1.deftones, snare_layer.deftones_sd02, snare_layer.deftones_sd30]
    rule: "Match velocity and round-robin index; trigger all source notes simultaneously and capture one coherent attack without post normalization."
  - target: snare1.sleep
    sources: [snare1.sleep, snare_layer.sleep_snare7]
    rule: "Match velocity and round-robin index and capture the simultaneous chord; Snare8 remains independently captured but is excluded because the closed-loop probe measured attack cancellation."
drumgizmo_instrument_groups:
  # DrumGizmo groups are bidirectional chokes: every new physical hi-hat hit
  # fades the previous member. This prevents captured open tails from stacking
  # and gives pedal-close/pedal-splash the same playable role as the SD3 CC4 hat.
  hihat:
    - hh.bow_closed
    - hh.bow_quarter
    - hh.bow_half
    - hh.bow_three_quarter
    - hh.bow_open
    - hh.edge_closed
    - hh.edge_third
    - hh.edge_half
    - hh.edge_two_thirds
    - hh.edge_open
    - hh.pedal_close
    - hh.pedal_splash
    - hh.electronic_closed
    - hh.electronic_open

  - {logical: snare1.deftones_edge, note: 39, source: death_darkness, status: not-routed-until-pad-measurement}
  - {logical: snare1.sleep_edge, note: 44, source: progressive_foundry, status: not-routed-until-pad-measurement}
scenes:

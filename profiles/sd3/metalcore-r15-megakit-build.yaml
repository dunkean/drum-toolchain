base_pad_overrides:
  # The source rimshot is intentionally much louder than the regular snare
  # articulations.  Keep its character while leaving capture headroom.
  1:
    snareFX: {pvolume: 0.39}
  # Closed-loop v14 calibration showed the third acoustic tom about 8 dB
  # below the other acoustic toms at the same representative velocity.
  5:
    tom4R: {pvolume: 2.50}
  # Pedal chick/splash are physical performance articulations, not quiet
  # utility previews. Keep them below stick hits but clearly audible live.
  2:
    hatsPL: {pvolume: 3.50}
    hatsPLO: {pvolume: 3.50}
  # The Electronic Edge glitch transient was 12.6 dB above the alternate
  # stack and 24.7 dB above the acoustic stack at the same velocity in the
  # closed-loop v14 report. Align all three stack choices before capture.
  19:
    FX1: {pvolume: 0.058}
  # The v16 family gate caught both utility percussion voices below the
  # playable percussion range. Preserve their contrast without hiding them.
  18:
    opentri: {pvolume: 2.40}
  20:
    cowbell: {pvolume: 1.80}
mixer_overrides:
  # Preserve the source mix while leaving deterministic safety headroom for
  # the transient-heavy rimshots and imported, compressed scene buses.
  # The source preset's opaque master limiter pins hard transients around
  # -0.13 dBFS regardless of the upstream scene gains. Keep the scene/bus
  # processing, but remove that final limiter for deterministic capture and
  # leave safety headroom at the output fader.
  "output 0": {volume: 0.55, clear_effects: true}
  X-Sub1: {volume: 0.75, route: "buss 10"}
  X-SubR1: {volume: 0.75, route: "buss 10"}
  X-Perc: {volume: 0.68, route: "buss 11"}
  X-PercR: {volume: 0.68, route: "buss 11"}
  # The Electronic Edge high tom is substantially quieter than TL06 at the
  # same MIDI velocity.  This channel trim aligns the electronic tom family.
  X-FX-11: {volume: 2.25, route: "buss 12"}
  X-FX-1R1: {volume: 0.46, route: "buss 12"}
  X-FX-12: {volume: 0.46, route: "buss 12"}
  X-FX-1R2: {volume: 0.46, route: "buss 12"}
  X-Perc3: {volume: 0.46, route: "buss 12"}
  X-PercR3: {volume: 0.46, route: "buss 12"}
  X-ClosedHats-1: {volume: 1.0, route: "buss 13"}
  X-ClosedHats-1R: {volume: 1.0, route: "buss 13"}
  X-Perc2: {volume: 1.0, route: "buss 13"}
  X-PercR2: {volume: 1.0, route: "buss 13"}
  X-Sub2: {volume: 0.565, route: "buss 14"}
  X-SubR2: {volume: 0.565, route: "buss 14"}
  X-Perc1: {volume: 0.758, route: "buss 15"}
  X-PercR1: {volume: 0.758, route: "buss 15"}
  X-Claps-2: {volume: 0.42, route: "buss 14"}
  X-Claps-2R: {volume: 0.42, route: "buss 14"}
  X-TunedKicks: {volume: 0.25, route: "buss 14"}
  X-PercS-1: {volume: 0.18, route: "buss 14"}
  X-PercS-1R: {volume: 0.18, route: "buss 14"}
  X-Sub: {volume: 0.35, route: "buss 16"}
  X-SubR: {volume: 0.35, route: "buss 16"}
  # Imported snare close mics must remain on independent mixer lanes. Folding
  # top, bottom and ambience into one X-channel phase-cancelled the signal.
  # SD3 serializes route buss N to mixer entries buss 2N / buss 2N+1.
  X-Perc5: {volume: 0.50, route: "buss 17", clear_effects: true} # Deftones complete snare and native stack
  X-PercR5: {volume: 0.50, route: "buss 17", clear_effects: true}
  X-Riser: {volume: 0.75, route: "buss 18"}      # Sleep top condenser
  X-RiserR: {volume: 0.75, route: "buss 18"}
  X-Cowbell1: {volume: 0.147911, route: "buss 18"}   # Sleep top dynamic
  X-Cowbell2: {volume: 0.144659, route: "buss 18"}   # Sleep bottom
  X-Perc4: {volume: 0.78, route: "buss 15"}
  X-PercR4: {volume: 0.78, route: "buss 15"}
  "buss 20": {volume: 0.65035, route: "output 0", username: "DnB Kicks"}
  "buss 21": {volume: 0.65035, route: "output 0"}
  "buss 22": {volume: 0.702172, route: "output 0", username: "DnB Snares"}

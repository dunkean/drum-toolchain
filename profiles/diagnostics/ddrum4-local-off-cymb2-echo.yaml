# Temporary hardware proof only.  Derived from the observed UMC trace on
# 2026-08-10: a snare pad on the DDrum4 CYMB2 trigger input emits C12/note 17.
# It deliberately returns the identical note, making no musical mapping claim.
bank:
  id: ddrum4-local-off-cymb2-echo
midi:
  ddrum_output_channel: 12
  sources:
    ddrum4: {channel: 12}
hihat:
  mode: direct_cc4
  source: ddrum4
  input_cc: 4
  output_cc: 4
  input_closed: 0
  input_open: 127
  output_closed: 0
  output_open: 127
routes:
  - id: diagnostic.cymb2.identity
    source: ddrum4
    input_note: 17
    target:
      output_note: 17
      velocity: {input_min: 1, input_max: 127, output_min: 1, output_max: 127}

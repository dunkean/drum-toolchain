# Temporary hardware proof only.  Derived from the observed UMC trace on
# 2026-08-10: a snare pad on the DDrum4 CYMB2 trigger input emits C12/note 17.
# It deliberately selects the second CYMB2 Note-P branch.  The source pad
# emits note 17; the bridge returns note 18.  CYMB2 must be configured with
# Note # 17 and Note P 2 before this diagnostic is flashed.
bank:
  id: ddrum4-local-off-cymb2-nested-branch
midi:
  ddrum_output_channel: 12
  sources:
    ddrum4: {channel: 12}
hihat:
  mode: direct_cc4
  source: ddrum4
  input_cc: 4
  output_cc: 4
  input_closed: 0
  input_open: 127
  output_closed: 0
  output_open: 127
routes:
  - id: diagnostic.cymb2.second_note_p_branch
    source: ddrum4
    input_note: 17
    target:
      output_note: 18
      # Preserve the pad dynamics.  The DDrum4 sound itself selects its
      # velocity layer from this returned value; per-pad curves belong in the
      # production routing profile after the trigger is calibrated.
      velocity: {input_min: 1, input_max: 127, output_min: 1, output_max: 127}
  # A genuine DDrum cymbal in CYb mode emits both Note-P positions, 17 and 18.
  # Cross-map them so each raw source event and its returned module echo remain
  # different notes.  This is the declared two-position nested layout.
  - id: diagnostic.cymb2.first_note_p_branch
    source: ddrum4
    input_note: 18
    target:
      output_note: 17
      velocity: {input_min: 1, input_max: 127, output_min: 1, output_max: 127}

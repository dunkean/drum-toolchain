# Canonical no-pad project for installed r15. Only the endpoint names are SIM.
# Channels and raw note/controller addresses are the prescribed module contract.
schema_version: 1
kind: rig-project
project: metalcore-r15-topology-simulator
rig: profiles/physical/greg-hybrid-kit.yaml
physical_bindings:
  kick.hit: {instrument: kick_main, zone: head}
  snare1.head: {instrument: snare_main, zone: head}
  snare1.rimshot: {instrument: snare_main, zone: rimshot}
  snare1.cross: {instrument: snare_main, zone: cross_stick}
  snare2.head: {instrument: snare_secondary, zone: head}
  snare2.rimshot: {instrument: snare_secondary, zone: rimshot}
  snare2.cross: {instrument: snare_secondary, zone: cross_stick}
  tom1.hit: {instrument: tom_1, zone: head}
  tom2.hit: {instrument: tom_2, zone: head}
  tom3.hit: {instrument: tom_3, zone: head}
  hh.bow: {instrument: hihat_main, zone: bow}
  hh.edge: {instrument: hihat_main, zone: edge}
  hh.pedal_close: {instrument: hihat_main, zone: chick}
  hh.pedal_splash: {instrument: hihat_main, zone: splash}
  ride.bow: {instrument: ride_main, zone: bow}
  ride.bell: {instrument: ride_main, zone: bell}
  crash1.bow: {instrument: crash_1, zone: bow}
  crash1.edge: {instrument: crash_1, zone: edge}
  crash2.bow: {instrument: crash_2, zone: bow}
  crash2.edge: {instrument: crash_2, zone: edge}
  crash3.edge: {instrument: crash_3, zone: edge}
  splash1.hit: {instrument: splash_1, zone: bow}
  splash2.hit: {instrument: splash_2, zone: bow}
  stack.hit: {instrument: stack, zone: bow}
  china1.edge: {instrument: china_1, zone: edge}
  china1.bell: {instrument: china_1, zone: bell}
  china2.edge: {instrument: china_2, zone: edge}
  china2.bell: {instrument: china_2, zone: bell}
  perc.hit: {instrument: hihat_aux, zone: head}
deployment: simulation
ddrum4_output_channel: 12
control_bus: {endpoint: SIM_UMC_MIDI_OUT, channel: 15, status: planned}
ddrum4_bank: {manifest: ../banks/metalcore-r15-installed.yaml, bank_id: metalcore-r15-installed, sha256: e9f3af35877a62b2ce070c7108df362dc5533279efc4a21506df18e7079497e7}
sources:
  ddrum4: {endpoint: SIM_DDrum4_DIN, channel: 12, primary: din, connection_profile: DIN_ONLY}
  ddti: {endpoint: SIM_DDTi_USB, channel: 2, primary: usb, connection_profile: LIVE_USB_PRIMARY}
  edrumin: {endpoint: SIM_eDRUMin_USB, channel: 3, primary: usb, connection_profile: LIVE_USB_PRIMARY}
connection_profiles:
  LIVE_USB_PRIMARY: {deduplicate_din_copies: true, usb_sources: true, din_sources: true}
  DIN_ONLY: {deduplicate_din_copies: false, usb_sources: false, din_sources: true}

# Ownership: DDrum4 = kick/toms/Snare2+Rim2/chinas/aux HH; eDRUMin = Snare1,
# continuous HH and ride; DDTi = crashes, splashes and stack. Raw notes below
# are written to/selected on the modules and must not be replaced by discovery.
source_decoders:
  - {match: {source: ddrum4, type: note, note: 0}, emit: {physical: kick.hit, expressions: [velocity]}}
  # NOTE P=8 on the DDrum4 input preserves the physical hit position as the
  # contiguous raw block 8..15. Renderers may keep, quantize, or ignore it.
  - {match: {source: ddrum4, type: note_range, note_range: [8, 15]}, emit: {physical: snare2.head, expressions: [velocity, position]}}
  - {match: {source: ddrum4, type: note, note: 16}, emit: {physical: snare2.rimshot, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 17}, emit: {physical: snare2.cross, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 24}, emit: {physical: tom1.hit, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 32}, emit: {physical: tom2.hit, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 40}, emit: {physical: tom3.hit, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 56}, emit: {physical: china1.edge, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 57}, emit: {physical: china1.bell, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 64}, emit: {physical: china2.edge, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 65}, emit: {physical: china2.bell, expressions: [velocity]}}
  - {match: {source: ddrum4, type: note, note: 72}, emit: {physical: perc.hit, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 0}, emit: {physical: snare1.head, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 1}, emit: {physical: snare1.rimshot, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 2}, emit: {physical: snare1.cross, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 3}, emit: {physical: hh.bow, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 4}, emit: {physical: hh.edge, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 5}, emit: {physical: hh.pedal_close, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 6}, emit: {physical: hh.pedal_splash, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 7}, emit: {physical: ride.bow, expressions: [velocity]}}
  - {match: {source: edrumin, type: note, note: 8}, emit: {physical: ride.bell, expressions: [velocity]}}
  - {match: {source: edrumin, type: cc, cc: 4}, emit: {physical: hh.bow, expressions: [openness], normalize: cc7}}
  - {match: {source: edrumin, type: cc, cc: 16}, emit: {physical: snare1.head, expressions: [position], normalize: cc7}}
  - {match: {source: ddti, type: note, note: 16}, emit: {physical: crash1.bow, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 17}, emit: {physical: crash1.edge, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 18}, emit: {physical: crash2.bow, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 19}, emit: {physical: crash2.edge, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 20}, emit: {physical: crash3.edge, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 21}, emit: {physical: splash1.hit, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 22}, emit: {physical: splash2.hit, expressions: [velocity]}}
  - {match: {source: ddti, type: note, note: 23}, emit: {physical: stack.hit, expressions: [velocity]}}
  # Chokes are correlated to the exact raw hit note. These are simulation
  # addresses only: the live campaign must observe hit -> aftertouch for each
  # articulation before an operator may confirm the renderer behavior.
  - {match: {source: edrumin, type: poly_aftertouch, note: 7, active_note: true}, emit: {physical: ride.bow, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: edrumin, type: poly_aftertouch, note: 8, active_note: true}, emit: {physical: ride.bell, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 16, active_note: true}, emit: {physical: crash1.bow, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 17, active_note: true}, emit: {physical: crash1.edge, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 18, active_note: true}, emit: {physical: crash2.bow, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 19, active_note: true}, emit: {physical: crash2.edge, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 20, active_note: true}, emit: {physical: crash3.edge, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 21, active_note: true}, emit: {physical: splash1.hit, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 22, active_note: true}, emit: {physical: splash2.hit, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddti, type: poly_aftertouch, note: 23, active_note: true}, emit: {physical: stack.hit, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddrum4, type: poly_aftertouch, note: 56, active_note: true}, emit: {physical: china1.edge, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddrum4, type: poly_aftertouch, note: 57, active_note: true}, emit: {physical: china1.bell, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddrum4, type: poly_aftertouch, note: 64, active_note: true}, emit: {physical: china2.edge, expressions: [pressure], correlate: source_channel_note}}
  - {match: {source: ddrum4, type: poly_aftertouch, note: 65, active_note: true}, emit: {physical: china2.bell, expressions: [pressure], correlate: source_channel_note}}
expression_routing:
  - source: edrumin
    physical: hh.bow
    expression: openness
    correlation: none
    targets:
      # Output mapping only: the eDRUMin raw notes remain 3/4.  CC4 must be
      # measured (closed/open polarity + thresholds) before this is flashable.
      ddrum4:
        status: planned
        reason: "Proposed CC4 polarity and zones are implemented but remain non-flashable until measured on the physical eDRUMin pedal"
        event:
          type: quantized_note_p
          note_from: active_rendered_hit
          input_closed: 127
          input_open: 0
          articulations:
            - {physical: hh.bow, notes: [72, 73, 74, 75, 76], upper_boundaries: [15, 47, 79, 111]}
            - {physical: hh.edge, notes: [40, 41, 42, 43], upper_boundaries: [31, 63, 95]}
      sd3: {status: user-confirmed, event: {type: cc, channel: 10, cc: 4, transform: passthrough}}
      drumgizmo:
        status: planned
        reason: "Discrete SD3 captures are defined; physical eDRUMin CC4 endpoints remain to be measured with the pedal"
        event:
          type: quantized_note
          input_closed: 127
          input_open: 0
          articulations:
            - {physical: hh.bow, notes: [112, 113, 114, 115, 116], upper_boundaries: [15, 47, 79, 111]}
            - {physical: hh.edge, notes: [117, 118, 121, 119, 120], upper_boundaries: [21, 52, 74, 106]}
  - source: edrumin
    physical: snare1.head
    expression: position
    correlation: none
    targets:
      ddrum4:
        status: unsupported
        reason: "Center/mid/edge CC16 thresholds need physical measurement and an explicit Arduino quantizer"
        event: {type: unsupported}
      sd3:
        status: user-confirmed
        event: {type: cc, channel: 10, cc: 16, transform: passthrough}
      drumgizmo:
        status: unsupported
        reason: "The current exported kit is note-only for snare position until a measured quantizer is added"
        event: {type: unsupported}
  -
    source: edrumin
    physical: ride.bow
    expression: pressure
    correlation: source_channel_note
    targets:
      ddrum4: {status: planned, reason: "Raw source choke and active-hit renderer behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      sd3: {status: planned, reason: "Raw source choke and SD3 active-hit behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      drumgizmo: {status: user-confirmed, event: {type: poly_aftertouch, note_from: active_rendered_hit}}
  - source: edrumin
    physical: ride.bell
    expression: pressure
    correlation: source_channel_note
    targets:
      ddrum4: {status: planned, reason: "Raw source choke and active-hit renderer behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      sd3: {status: planned, reason: "Raw source choke and SD3 active-hit behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      drumgizmo: {status: user-confirmed, event: {type: poly_aftertouch, note_from: active_rendered_hit}}
  - source: ddti
    physical: crash1.bow
    expression: pressure
    correlation: source_channel_note
    targets:
      ddrum4: {status: planned, reason: "Raw source choke and active-hit renderer behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      sd3: {status: planned, reason: "Raw source choke and SD3 active-hit behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      drumgizmo: {status: user-confirmed, event: {type: poly_aftertouch, note_from: active_rendered_hit}}
  - source: ddti
    physical: crash1.edge
    expression: pressure
    correlation: source_channel_note
    targets:
      ddrum4: {status: planned, reason: "Raw source choke and active-hit renderer behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      sd3: {status: planned, reason: "Raw source choke and SD3 active-hit behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      drumgizmo: {status: user-confirmed, event: {type: poly_aftertouch, note_from: active_rendered_hit}}
  - source: ddti
    physical: crash2.bow
    expression: pressure
    correlation: source_channel_note
    targets:
      ddrum4: {status: planned, reason: "Raw source choke and active-hit renderer behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      sd3: {status: planned, reason: "Raw source choke and SD3 active-hit behavior both require explicit review", event: {type: poly_aftertouch, note_from: active_rendered_hit}}
      drumgizmo: {status: user-confirmed, event: {type: poly_aftertouch, note_from: active_rendered_hit}}
  - source: ddti

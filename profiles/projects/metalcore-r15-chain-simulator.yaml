# The installed r15 bank is one persistent renderer palette.  Logical scenes
# select resident Sound variations through output notes; they must not invent
# unobserved DDrum4 Programs or change the module kit behind the player's back.
# Native panel controls can be added after their exact emitted MIDI bytes have
# been captured.  Until then CH14/15 is the only authoritative state protocol.
native_control_map: {}
ddrum_state_actions: {}
policies: {echo: measured_only, unknown_message: drop_and_count}

state:
  scenes: [metalcore, sleep_token, deftones, dnb, industrial, electro]
  variables: [vp1_snare1, vp2_flex, vp3_percussion_family, vp4_percussion_variant]
  defaults: {scene: metalcore, vp1_snare1: 1, vp2_flex: 1, vp3_percussion_family: 1, vp4_percussion_variant: 1}
  value_labels:
    vp1_snare1: {"1": Metalcore, "2": Deftones, "3": Sleep Token, "4": Industrial, "5": Electro}
    vp2_flex: {"1": Acoustic tom 4, "2": Metalcore snare 2, "3": Deftones snare 2, "4": Sleep Token snare 2, "5": Electro snare 2, "6": Sleep Token tom 4}
    vp3_percussion_family: {"1": Acoustic stack, "2": Hybrid stack, "3": Glitch stack, "4": Metallic hit, "5": Clap stack, "6": Progressive 20-17-13 Custom Stack, "7": Forced half-open HH edge, "8": Forced closed HH edge}
    vp4_percussion_variant: {"1": Utility, "2": Cowbell, "3": Woodblock, "4": Click, "5": Clap}
logical_control_protocol:
  scene: {channels: [14, 15], type: program_change}
  vp1_snare1: {channels: [14, 15], type: cc, cc: 20}
  vp2_flex: {channels: [14, 15], type: cc, cc: 21}
  vp3_percussion_family: {channels: [14, 15], type: cc, cc: 22}
  vp4_percussion_variant: {channels: [14, 15], type: cc, cc: 23}
logical_routes:
  metalcore: &acoustic
    kick.hit: kick.acoustic
    tom1.hit: tom1.acoustic
    tom2.hit: tom2.acoustic
    tom3.hit: tom3.acoustic
    snare2.head: [{logical_target: snare2.metalcore, when: {vp2_flex: 2}}, {logical_target: snare2.deftones, when: {vp2_flex: 3}}, {logical_target: snare2.sleep, when: {vp2_flex: 4}}, {logical_target: snare2.electro, when: {vp2_flex: 5}}, {logical_target: tom4.sleep, when: {vp2_flex: 6}}, {logical_target: tom4.acoustic}]
    snare2.rimshot: [{logical_target: rim2.rimshot, when: {vp2_flex: 3}}, {logical_target: rim_sleep.rimshot, when: {vp2_flex: 4}}, {logical_target: rim1.rimshot}]
    snare2.cross: [{logical_target: rim2.cross, when: {vp2_flex: 3}}, {logical_target: rim_sleep.cross, when: {vp2_flex: 4}}, {logical_target: rim1.cross}]
    snare1.head: [{logical_target: snare1.deftones, when: {vp1_snare1: 2}}, {logical_target: snare1.sleep, when: {vp1_snare1: 3}}, {logical_target: snare1.industrial, when: {vp1_snare1: 4}}, {logical_target: snare1.electro, when: {vp1_snare1: 5}}, {logical_target: snare1.metalcore}]
    snare1.rimshot: [{logical_target: rim2.rimshot, when: {vp1_snare1: 2}}, {logical_target: rim_sleep.rimshot, when: {vp1_snare1: 3}}, {logical_target: rim1.rimshot}]
    snare1.cross: [{logical_target: rim2.cross, when: {vp1_snare1: 2}}, {logical_target: rim_sleep.cross, when: {vp1_snare1: 3}}, {logical_target: rim1.cross}]
    hh.bow: hh.bow
    hh.edge: hh.edge
    hh.pedal_close: hh.pedal_close
    hh.pedal_splash: hh.pedal_splash
    ride.bow: ride.bow
    ride.bell: ride.bell
    crash1.bow: crash1.bow
    crash1.edge: crash1.edge
    crash2.bow: crash2.bow
    crash2.edge: crash2.edge
    crash3.edge: crash3.edge
    splash1.hit: splash1.acoustic
    splash2.hit: splash2.acoustic
    china1.edge: china1.edge
    china1.bell: china1.bell
    china2.edge: china2.edge
    china2.bell: china2.bell
    perc.hit: [{logical_target: perc.cowbell, when: {vp4_percussion_variant: 2}}, {logical_target: perc.woodblock, when: {vp4_percussion_variant: 3}}, {logical_target: perc.click, when: {vp4_percussion_variant: 4}}, {logical_target: perc.clap, when: {vp4_percussion_variant: 5}}, {logical_target: perc.utility}]

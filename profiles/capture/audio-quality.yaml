# Reusable, editable preparation policies. Source WAVs are never overwritten.
profiles:
  full:
    target_sample_rate: 44100
    trim_threshold_db: -60
    normalize_dbfs: -1.0
    fade_in_ms: 1.0
    fade_out_ms: 12.0
    highpass_hz: 20
    lowpass_hz: 19500
  balanced:
    target_sample_rate: 44100
    trim_threshold_db: -55
    normalize_dbfs: -1.0
    fade_in_ms: 2.0
    fade_out_ms: 8.0
    highpass_hz: 25
    lowpass_hz: 18000
  compact:
    target_sample_rate: 44100
    trim_threshold_db: -48
    normalize_dbfs: -1.5
    fade_in_ms: 2.0
    fade_out_ms: 5.0
    highpass_hz: 35
    lowpass_hz: 15000
  ddrum4_snare:
    # Mono, short tails preserve the seven head layers inside the measured
    # 1,270-block free-memory budget while retaining the snare transient.
    target_sample_rate: 44100
    trim_threshold_db: -48
    normalize_dbfs: -1.5
    fade_in_ms: 2.0
    fade_out_ms: 10.0
    highpass_hz: 35
    lowpass_hz: 16500
    max_duration_seconds: 1.35
    force_mono: true
  ddrum4_snare_flagship:
    # Keep the captured decay after onset even after it falls below the
    # activity threshold. SNRE_950 proved that threshold-tail trimming makes
    # the module audibly cut the snare after 0.13..0.74 seconds.
    target_sample_rate: 44100
    trim_threshold_db: -60
    normalize_dbfs: -1.5
    fade_in_ms: 1.0
    fade_out_ms: 15.0
    highpass_hz: 30
    lowpass_hz: 17500
    max_duration_seconds: 1.8
    force_mono: true
    trim_tail: false
  ddrum4_hihat_flagship:
    # The builder supplies an explicit per-articulation duration: short closed
    # states should not spend the same memory as open hats and foot splash.
    # Keep every captured decay up to that reviewed bound.
    target_sample_rate: 44100
    trim_threshold_db: -90
    normalize_dbfs: -2.0
    fade_in_ms: 1.0
    fade_out_ms: 30.0
    highpass_hz: 30
    lowpass_hz: 17000
    force_mono: true
    trim_tail: true
  ddrum4_drum:
    target_sample_rate: 44100
    trim_threshold_db: -50
    normalize_dbfs: -1.5
    fade_in_ms: 2.0
    fade_out_ms: 8.0
    highpass_hz: 30
    lowpass_hz: 16000
    max_duration_seconds: 1.0
    force_mono: true
  ddrum4_cymbal:
    # Compact transport candidate. Do not use it for either flagship crash:
    # the 1.75-second limit made CYMB_995 audibly unnatural on the module.
    target_sample_rate: 44100
    trim_threshold_db: -52
    normalize_dbfs: -2.0
    fade_in_ms: 2.0
    fade_out_ms: 15.0
    highpass_hz: 30
    lowpass_hz: 15500
    max_duration_seconds: 1.75
    force_mono: true
  ddrum4_cymbal_flagship:
    # Capture for ten seconds, then preserve enough mono material for a real
    # four-second decay on the module. Measure encoded blocks after building;
    # do not estimate them from this policy.
    target_sample_rate: 44100
    trim_threshold_db: -66
    normalize_dbfs: -2.0
    fade_in_ms: 1.0
    fade_out_ms: 20.0
    highpass_hz: 30
    lowpass_hz: 15500
    max_duration_seconds: 4.5
    force_mono: true
  ddrum4_crash_flagship:
    # Direct WASAPI loopback is digitally silent after the SD3 render. Keep
    # each selected decay down to -90 dB; the builder supplies a shorter bound
    # for soft layers and the full measured tail for hard layers.
    target_sample_rate: 44100
    trim_threshold_db: -90
    normalize_dbfs: -2.0
    fade_in_ms: 1.0
    fade_out_ms: 30.0
    highpass_hz: 30
    lowpass_hz: 17000
    force_mono: true
    # Keep a fixed silent safety window after the natural SD3 decay. Hardware
    # listening showed that velocity-dependent trimming makes panel and soft
    # hits feel unnaturally short even when the hard source tail is intact.
    trim_tail: false

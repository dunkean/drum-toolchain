[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-lab"
version = "0.1.0"
description = "Safe MIDI discovery, tracing, and offline latency analysis"
requires-python = ">=3.12"
dependencies = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
midi-lab = "midi_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

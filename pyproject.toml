[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-toolchain-workspace"
version = "0.1.0"
description = "Hybrid drum sampling, ddrum4 soundbank, MIDI conversion, and Arduino bridge workspace"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "sounddevice>=0.5,<1",
  "soundcard>=0.4.6,<1",
  "jsonschema>=4.25,<5",
]

# This distribution defines the shared workspace dependencies.  Individual
# applications use their own src layouts, so setuptools must not attempt to
# infer packages from the repository's top-level directories.
[tool.setuptools]
py-modules = ["drum_toolchain"]

[project.scripts]
drum-toolchain = "drum_toolchain:main"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps", "tools"]

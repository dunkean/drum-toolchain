[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-control-center"
version = "0.1.0"
description = "Offline orchestration UI for drum-toolchain rig projects"
requires-python = ">=3.12"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
drum-control-center = "control_center.cli:main"

[project.gui-scripts]
drum-control-center-gui = "control_center.gui:launch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

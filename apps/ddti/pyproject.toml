[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddti"
version = "0.1.0"
description = "Safe desktop configuration editor for the legacy ddrum DDTi"
requires-python = ">=3.12"
dependencies = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
gui = ["PySide6>=6.8,<7"]

[project.scripts]
ddti = "ddti.cli:main"
ddti-editor = "ddti.gui:launch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

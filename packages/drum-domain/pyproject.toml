[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-domain"
version = "0.1.0"
description = "Versioned domain contracts for the drum toolchain"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

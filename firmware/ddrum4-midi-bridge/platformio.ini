[platformio]
default_envs = uno

[env]
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17

; Uno/Nano: MIDI DIN shares Serial with the USB serial adapter. Keep DEBUG off.
[env:uno]
platform = atmelavr
framework = arduino
board = uno
lib_deps =
  fortyseveneffects/MIDI Library @ ^5.0.2
build_flags =
  -D ROUTER_USE_SD=0
  -D ROUTER_DEBUG=0
  -D ROUTER_MODE_CONTROL_CHANNEL=16
  -D ROUTER_MODE_CONTROL_CC=119

; Temporary diagnostic: sends note 38 / channel 10 every two seconds.
; Use only when Arduino OUT is connected to a monitor/Midiface, never the ddrum.
[env:uno_tx_test]
platform = atmelavr
framework = arduino
board = uno
lib_deps =
  fortyseveneffects/MIDI Library @ ^5.0.2
build_flags =
  -D ROUTER_USE_SD=0
  -D ROUTER_DEBUG=0
  -D ROUTER_TX_SELF_TEST=1

; Uno R3 plus an SD module/shield. Connect it over SPI and use its CS pin.
; This is the profile to use for a configuration file without recompiling.
[env:uno_sd]
platform = atmelavr
framework = arduino
board = uno
lib_deps =
  arduino-libraries/SD @ ^1.3.0
  fortyseveneffects/MIDI Library @ ^5.0.2
build_flags =
  -D ROUTER_USE_SD=1
  -D ROUTER_SD_CS=10
  -D ROUTER_DEBUG=0

; Recommended when a USB diagnostic console and MIDI DIN are both required.
[env:megaatmega2560]
platform = atmelavr
framework = arduino
board = megaatmega2560
lib_deps =
  arduino-libraries/SD @ ^1.3.0
  fortyseveneffects/MIDI Library @ ^5.0.2
build_flags =
  -D ROUTER_USE_SD=1
  -D ROUTER_SD_CS=53
  -D ROUTER_DEBUG=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
extra_scripts = pre:scripts/native_static_runtime.py
build_flags =
  -I test/support
build_src_filter =
  +<DdrumBridge.cpp>
  +<MidiDinAdapter.cpp>
  -<main.cpp>
